name: ci
on: [push, pull_request]

jobs:
  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys gcc-riscv64-unknown-elf
          pip install --break-system-packages "cocotb==2.1.*" pytest
      - name: Lint
        run: make lint
      - name: Synthesizability
        run: make synth
      - name: Test programs (RV32E, RV64, CoreMark)
        run: make sw
      - name: Unit, system and chip-level tests
        run: make test
      - name: Area estimate
        run: make area
      - name: RVC cross-check vs Ibex
        run: |
          git clone --depth 1 https://github.com/lowRISC/ibex.git /tmp/ibex
          IBEX_DIR=/tmp/ibex make xcheck
